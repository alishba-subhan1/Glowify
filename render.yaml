services:
  - type: web
    name: glowify-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://glowify-client.onrender.com
      - key: CLIENT_PUBLIC_URL
        value: https://glowify-client.onrender.com

  - type: web
    name: glowify-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://glowify-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
